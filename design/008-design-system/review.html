<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Review</title>
<!--
  Design review page. The Designer copies this file into design/<task>/review.html
  and writes design/<task>/review-data.js next to it (see review-data.example.js).
  Prototypes are shown live (clickable) inside frames at real phone and desktop sizes.
  Kept neutral and plain on purpose so the designs, not this page, stand out.
-->
<style>
  :root {
    --bg: #eceef1; --surface: #ffffff; --ink: #16181d; --muted: #5b6270; --line: #d5d9e0;
    --accent: #2f5bea; --accent-ink: #ffffff; --frame: #1b1d22;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15171b; --surface: #1f2228; --ink: #eceef1; --muted: #9aa1ad; --line: #30343c; --frame: #000; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 96rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header { display: grid; gap: .5rem; margin-bottom: 1.25rem; }
  .eyebrow { font-size: .8rem; color: var(--muted); letter-spacing: .03em; }
  h1 { margin: 0; font-size: 1.6rem; line-height: 1.2; }
  .short { margin: 0; max-width: 60ch; font-size: 1.05rem; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: .9rem 1rem; }
  .box h2 { margin: 0 0 .35rem; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .box ul { margin: 0; padding-left: 1.1rem; }
  .meta { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); margin-bottom: 1.25rem; }
  .history q { font-style: italic; }

  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
    justify-content: space-between; padding: .6rem 0; background: var(--bg); margin-bottom: .5rem; }
  .switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
  .switch button { border: 0; background: none; color: var(--ink); font: inherit; font-weight: 600; padding: .45rem 1rem; cursor: pointer; min-height: 40px; }
  .switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .switch button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .options { display: grid; gap: 1.25rem; }
  .options[data-view="phone"] { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .option { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: grid; gap: .75rem; align-content: start; }
  .option-head { display: flex; gap: .75rem; align-items: flex-start; }
  .letter { flex: none; width: 2.25rem; height: 2.25rem; border-radius: 8px; display: grid; place-items: center;
    background: var(--ink); color: var(--surface); font-weight: 800; font-size: 1.1rem; }
  .option h3 { margin: 0; font-size: 1.1rem; }
  .option p { margin: 0; color: var(--muted); }
  .open { font-size: .85rem; color: var(--accent); }

  /* Frames show the prototype at its real size, scaled down to fit. */
  .stage { width: 100%; overflow: hidden; border-radius: 10px; background: var(--frame); padding: 8px; }
  .viewport { position: relative; overflow: hidden; background: #fff; border-radius: 4px; }
  .viewport iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }

  .reply { margin-top: 1.5rem; }
  .reply code { background: var(--bg); padding: .1rem .35rem; border-radius: 4px; }
  .empty { padding: 2rem; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title">Design review</h1>
    <p class="short" id="short"></p>
  </header>

  <div class="meta" id="meta"></div>

  <div class="bar">
    <div class="switch" role="group" aria-label="Screen size">
      <button type="button" data-view="phone" aria-pressed="true">Phone (375px)</button>
      <button type="button" data-view="desktop" aria-pressed="false">Desktop (1280px)</button>
    </div>
    <span class="eyebrow" id="count"></span>
  </div>

  <div class="options" id="options" data-view="phone"></div>

  <div class="box reply">
    <h2>Your decision</h2>
    <p>Reply in the chat, in your own words. For example:</p>
    <ul>
      <li><code>approve B</code></li>
      <li><code>B, but with warmer colors and bigger names</code></li>
      <li><code>none of these: try something that feels like a real office</code></li>
    </ul>
    <p>Nothing is built until you approve. There's no limit on rounds of changes.</p>
  </div>
</div>

<script src="review-data.js"></script>
<script>
  const SIZES = { phone: { w: 375, h: 812 }, desktop: { w: 1280, h: 800 } };
  const R = window.REVIEW;
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const list = (items) => `<ul>${items.map((i) => `<li>${esc(i)}</li>`).join('')}</ul>`;

  if (!R) {
    document.getElementById('options').innerHTML = '<p class="empty">No review-data.js found next to this page.</p>';
  } else {
    document.title = `Design Review: ${R.task}`;
    document.getElementById('eyebrow').textContent = `Task ${R.task} · version ${R.version} · ${R.model ? `made with ${R.model}` : ''}`;
    document.getElementById('title').textContent = R.title;
    document.getElementById('short').textContent = R.inShort;

    const meta = [];
    if (R.question) meta.push(`<div class="box"><h2>What we're deciding</h2><p style="margin:0">${esc(R.question)}</p></div>`);
    if (R.changes?.length) meta.push(`<div class="box"><h2>Changed since last version</h2>${list(R.changes)}</div>`);
    if (R.history?.length) meta.push(`<div class="box history"><h2>Your earlier feedback</h2><ul>${R.history.map((h) => `<li>v${esc(h.version)}: <q>${esc(h.feedback)}</q></li>`).join('')}</ul></div>`);
    document.getElementById('meta').innerHTML = meta.join('');
    document.getElementById('count').textContent = R.options.length > 1 ? `${R.options.length} directions to compare` : 'One design';

    document.getElementById('options').innerHTML = R.options.map((o) => `
      <section class="option" aria-labelledby="opt-${esc(o.id)}">
        <div class="option-head">
          <span class="letter" aria-hidden="true">${esc(o.id)}</span>
          <div><h3 id="opt-${esc(o.id)}">${R.options.length > 1 ? `${esc(o.id)}: ` : ''}${esc(o.name)}</h3><p>${esc(o.idea)}</p></div>
        </div>
        <div class="stage"><div class="viewport"><iframe src="${esc(o.file)}" title="${esc(o.name)} prototype" loading="lazy"></iframe></div></div>
        <a class="open" href="${esc(o.file)}" target="_blank" rel="noopener">Open full size ↗</a>
      </section>`).join('');
  }

  // Size every frame to the chosen screen, scaled to fit its column.
  let view = 'phone';
  function fit() {
    const { w, h } = SIZES[view];
    document.querySelectorAll('.viewport').forEach((vp) => {
      const avail = vp.parentElement.clientWidth - 16;
      const scale = Math.min(1, avail / w);
      vp.style.width = `${w * scale}px`;
      vp.style.height = `${h * scale}px`;
      vp.style.margin = '0 auto';
      const f = vp.querySelector('iframe');
      f.style.width = `${w}px`;
      f.style.height = `${h}px`;
      f.style.transform = `scale(${scale})`;
    });
  }
  document.querySelectorAll('.switch button').forEach((b) => b.addEventListener('click', () => {
    view = b.dataset.view;
    document.getElementById('options').dataset.view = view;
    document.querySelectorAll('.switch button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    fit();
  }));
  new ResizeObserver(fit).observe(document.body);
  fit();
</script>
</body>
</html>
